name: Build KombajnLesnyPRO

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build EXE
      shell: cmd
      run: pyinstaller --noconfirm --onefile --windowed --icon "kombajn.ico" --name "KombajnLesnyPRO" --add-data "STR_TYT.docx;." --add-data "STR_TYT_TYLKO-ISL-2.docx;." --add-data "Skroty.docx;." --add-data "BIAŁYNIN KRASÓWKA.xlsx;." --add-data "config;config" --add-data "pusty;pusty" --collect-all customtkinter --collect-all CTkToolTip --collect-all pandas --collect-all numpy --collect-all fitz --collect-all openpyxl --collect-all docx --collect-all PIL --collect-all pypdf --collect-all pyodbc --hidden-import win32com.client --hidden-import pythoncom --hidden-import pyautogui --collect-submodules app main.py

    - name: Upload EXE to release
      uses: softprops/action-gh-release@v2
      with:
        files: dist/KombajnLesnyPRO.exe
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
